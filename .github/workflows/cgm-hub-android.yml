name: Build CGM Hub Android app

on:
  push:
    branches: [master]
    paths: ['cgm-hub-android/**', '.github/workflows/cgm-hub-android.yml']
  pull_request:
    paths: ['cgm-hub-android/**', '.github/workflows/cgm-hub-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgm-hub-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cgm-hub-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      # Pull requests: just check that it builds (debug-signed, not published)
      - name: Check build (pull request)
        if: github.event_name == 'pull_request'
        working-directory: cgm-hub-android/android
        run: ./gradlew --no-daemon assembleDebug

      # master / manual: build with your personal signing key and publish
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 secret first (repo Settings → Secrets and variables → Actions). See cgm-hub-android/README.md"
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/release.keystore
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        working-directory: cgm-hub-android/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish to the "android-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cgm-hub.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "CGM Hub Android app" --latest=false \
              --notes "Personal build of CGM Hub. On your phone, download cgm-hub.apk below and open it to install or update."
          gh release upload android-latest cgm-hub.apk --clobber
          rm -f android/app/release.keystore
