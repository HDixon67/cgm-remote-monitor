name: Deploy CGM Hub to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['cgm-hub/**', '.github/workflows/cgm-hub-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cgm-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cgm-hub
      - id: deployment
        uses: actions/deploy-pages@v4
